---
# Homepage widgets.yaml (top bar)
# Docs: https://gethomepage.dev/configs/widgets/

- greeting:
    text_size: xl
    text: Hey Luke

- datetime:
    text_size: l
    format:
      timeStyle: short
      dateStyle: short
      hour12: false

- search:
    provider: google
    focus: false
    target: _blank

- openmeteo:
    label: Steinhausen
    latitude: 47.1960676
    longitude: 8.4916749
    timezone: Europe/Zurich
    units: metric
    cache: 5

