---
# Homepage services.yaml
# Docs: https://gethomepage.dev/configs/services/
# Secrets use {{HOMEPAGE_VAR_*}} — real values live in .env (gitignored) and
# are substituted at deploy time by `make deploy-rendered`.
#
# Consolidated to four groups on 2026-08-15. Removed: Ollama (app no longer
# installed), Home Assistant (token expired, little automation in use),
# n8n and Paperless-AI (services still running, just not worth a tile).
# Note: n8n still powers the iPhone → Mealie recipe pipeline — the tile went,
# the service did not.

- Media:
    - Jellyfin:
        href: http://the-library.tail227692.ts.net:8096
        description: Media server
        icon: jellyfin.png
        ping: 192.168.1.20
        widget:
          type: jellyfin
          url: http://192.168.1.20:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          enableBlocks: true
          enableNowPlaying: true

    - qBittorrent:
        href: http://the-library.tail227692.ts.net:30024
        description: Torrent client
        icon: qbittorrent.png
        ping: 192.168.1.20
        widget:
          type: qbittorrent
          url: http://192.168.1.20:30024
          username: "{{HOMEPAGE_VAR_QBT_USER}}"
          password: "{{HOMEPAGE_VAR_QBT_PASS}}"

- Documents:
    - Paperless-ngx:
        href: http://the-library.tail227692.ts.net:30070
        description: Document management
        icon: paperless-ngx.png
        ping: 192.168.1.20
        widget:
          type: paperlessngx
          url: http://192.168.1.20:30070
          key: "{{HOMEPAGE_VAR_PAPERLESS_KEY}}"

    - Mealie:
        href: https://recipes.lukecartledge.com
        description: Recipe & meal planning
        icon: mealie.png
        ping: 192.168.1.20
        widget:
          type: mealie
          url: http://192.168.1.20:30111
          key: "{{HOMEPAGE_VAR_MEALIE_KEY}}"
          version: 2

    - Karakeep:
        href: https://bookmarks.lukecartledge.com
        description: Bookmark manager
        icon: karakeep.png
        ping: 192.168.1.20
        # Enabled 2026-08-19 on Homepage v2.0.0. The karakeep widget is
        # credentialed — key is an ak2_* token from Karakeep → Settings →
        # API Keys, held in .env as HOMEPAGE_VAR_KARAKEEP_KEY and substituted
        # locally by `make deploy-rendered`.
        widget:
          type: karakeep
          url: http://192.168.1.20:30147
          key: "{{HOMEPAGE_VAR_KARAKEEP_KEY}}"

- Network:
    - Pi-hole:
        href: http://the-library.tail227692.ts.net:20720/admin
        description: DNS ad blocking
        icon: pi-hole.png
        ping: 192.168.1.20
        # Enabled 2026-08-19 on Homepage v2.0.0 — deliberately keyless.
        # Pi-hole has no API password set: POSTing an empty password to
        # /api/auth returns "no password set", and /api/stats/summary answers
        # unauthenticated. The old HOMEPAGE_VAR_PIHOLE_KEY was stale, so Pi-hole
        # rejected it with "password incorrect" and returned validity: -1.
        # Homepage passed that through as a negative memory-cache TTL, which
        # throws "Cache timeout must be a positive number" — the error
        # previously misattributed to a Homepage cache bug. v2.0.0 still does
        # not guard the negative case (it clamps only the upper bound), but it
        # does skip the login call entirely when no key is set, so omitting the
        # key is the fix. Only add a key here if Pi-hole is given an API
        # password.
        widget:
          type: pihole
          url: http://192.168.1.20:20720
          version: 6

    - Tailscale:
        href: https://login.tailscale.com
        description: VPN mesh network
        icon: tailscale.png
        # Enabled 2026-08-19. Unlike every other widget here there is no url:
        # the endpoint is absolute (api.tailscale.com), so this needs only the
        # device id and a key. deviceid is the stable node ID of this box, read
        # from `tailscale status --json` inside ix-tailscale-tailscale-1.
        #
        # EXPIRES 2026-11-17. Tailscale API access tokens are capped at
        # 90 days and cannot be extended, so this tile will start returning 401
        # then — the same way the Home Assistant tile died. Regenerate at
        # login.tailscale.com -> Settings -> Keys (must be a tskey-api-* access
        # token, not an auth key and not the node key).
        widget:
          type: tailscale
          deviceid: n85VohjPqE11CNTRL
          key: "{{HOMEPAGE_VAR_TAILSCALE_KEY}}"

- Infrastructure:
    - TrueNAS:
        href: http://the-library.tail227692.ts.net
        description: NAS management
        icon: truenas.png
        ping: 192.168.1.20
        # Widget still disabled — blocker is server-side, not Homepage.
        # Re-verified 2026-08-19 on Homepage v2.0.0 / TrueNAS 25.10.3.1: the
        # REST API still returns HTTP 500 on every /api/v2.0/* endpoint with a
        # valid key (401 without one, so auth is fine). Unchanged by the
        # Homepage v2 upgrade, as expected. iX are migrating to the JSON-RPC
        # websocket API. Re-test after a TrueNAS upgrade, not a Homepage one.
        # widget:
        #   type: truenas
        #   url: https://192.168.1.20
        #   key: "{{HOMEPAGE_VAR_TRUENAS_KEY}}"
        #   enablePools: true

    - Grafana:
        href: http://the-library.tail227692.ts.net:30300
        description: Sensor dashboard — temps & fans
        icon: grafana.png
        ping: 192.168.1.20
        # Deliberately NOT the built-in grafana widget: that one reports on
        # Grafana itself (dashboard count, datasource count, alert count),
        # which says nothing about the homelab. This queries Prometheus
        # directly for the numbers actually worth glancing at.
        #
        # One instant query returns four series; label_replace gives each a
        # distinct label so PromQL's `or` keeps all four rather than deduping
        # identical (empty) label sets. Mappings then index by position.
        # Order follows the `or` operands left-to-right — verified stable, but
        # if the tiles ever look transposed, that assumption is what broke.
        #
        # Decoded query:
        #   label_replace(max(node_hwmon_temp_celsius{chip=~".*coretemp.*"}),"k","1cpu","","")
        #   or label_replace(max(smartctl_device_temperature{temperature_type="current",device!~"nvme.*"}),"k","2drive","","")
        #   or label_replace(min(node_hwmon_fan_rpm > 0),"k","3fan","","")
        #   or label_replace(max(node_hwmon_temp_celsius{chip=~".*nvme.*"}),"k","4nvme","","")
        #
        # The fan query excludes 0 RPM on purpose: fan6/fan7 are unpopulated
        # headers that read a constant 0 and would otherwise always win min().
        widget:
          type: customapi
          url: "http://192.168.1.20:30090/api/v1/query?query=label_replace%28max%28node_hwmon_temp_celsius%7Bchip%3D~%22.%2Acoretemp.%2A%22%7D%29%2C%22k%22%2C%221cpu%22%2C%22%22%2C%22%22%29%20or%20label_replace%28max%28smartctl_device_temperature%7Btemperature_type%3D%22current%22%2Cdevice%21~%22nvme.%2A%22%7D%29%2C%22k%22%2C%222drive%22%2C%22%22%2C%22%22%29%20or%20label_replace%28min%28node_hwmon_fan_rpm%20%3E%200%29%2C%22k%22%2C%223fan%22%2C%22%22%2C%22%22%29%20or%20label_replace%28max%28node_hwmon_temp_celsius%7Bchip%3D~%22.%2Anvme.%2A%22%7D%29%2C%22k%22%2C%224nvme%22%2C%22%22%2C%22%22%29"
          refreshInterval: 30000
          mappings:
            - field: data.result.0.value.1
              label: CPU
              format: number
              suffix: "°C"
            - field: data.result.1.value.1
              label: Drives
              format: number
              suffix: "°C"
            - field: data.result.2.value.1
              label: Fan
              format: number
              suffix: RPM
            - field: data.result.3.value.1
              label: NVMe
              format: number
              suffix: "°C"

    - Dockge:
        href: http://the-library.tail227692.ts.net:31014
        description: Docker compose manager
        icon: dockge.png
        ping: 192.168.1.20

    - File Browser:
        href: http://the-library.tail227692.ts.net:30051
        description: Web file manager
        icon: filebrowser.png
        ping: 192.168.1.20
