---
# Homepage services.yaml
# Docs: https://gethomepage.dev/configs/services/
# Secrets use {{HOMEPAGE_VAR_*}} — real values live in .env (gitignored) and
# are substituted at deploy time by `make deploy-rendered`.
#
# Consolidated to four groups on 2026-08-15. Removed: Ollama (app no longer
# installed), Home Assistant (token expired, little automation in use),
# n8n and Paperless-AI (services still running, just not worth a tile).
# Note: n8n still powers the iPhone → Mealie recipe pipeline — the tile went,
# the service did not.

- Media:
    - Jellyfin:
        href: http://the-library.tail227692.ts.net:8096
        description: Media server
        icon: jellyfin.png
        ping: 192.168.1.20
        widget:
          type: jellyfin
          url: http://192.168.1.20:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          enableBlocks: true
          enableNowPlaying: true

    - qBittorrent:
        href: http://the-library.tail227692.ts.net:30024
        description: Torrent client
        icon: qbittorrent.png
        ping: 192.168.1.20
        widget:
          type: qbittorrent
          url: http://192.168.1.20:30024
          username: "{{HOMEPAGE_VAR_QBT_USER}}"
          password: "{{HOMEPAGE_VAR_QBT_PASS}}"

- Documents:
    - Paperless-ngx:
        href: http://the-library.tail227692.ts.net:30070
        description: Document management
        icon: paperless-ngx.png
        ping: 192.168.1.20
        widget:
          type: paperlessngx
          url: http://192.168.1.20:30070
          key: "{{HOMEPAGE_VAR_PAPERLESS_KEY}}"

    - Mealie:
        href: https://recipes.lukecartledge.com
        description: Recipe & meal planning
        icon: mealie.png
        ping: 192.168.1.20
        widget:
          type: mealie
          url: http://192.168.1.20:30111
          key: "{{HOMEPAGE_VAR_MEALIE_KEY}}"
          version: 2

    - Karakeep:
        href: https://bookmarks.lukecartledge.com
        description: Bookmark manager
        icon: karakeep.png
        ping: 192.168.1.20
        # A karakeep widget DOES exist in Homepage 1.13.2 (endpoint
        # /api/v1/users/me/stats) but it is credentialed. To enable:
        #   1. Karakeep → Settings → API Keys → create a key
        #   2. Add HOMEPAGE_VAR_KARAKEEP_KEY=<key> to .env
        #   3. Uncomment the block below and `make deploy-rendered`
        # widget:
        #   type: karakeep
        #   url: http://192.168.1.20:30147
        #   key: "{{HOMEPAGE_VAR_KARAKEEP_KEY}}"

- Network:
    - Pi-hole:
        href: http://the-library.tail227692.ts.net:20720/admin
        description: DNS ad blocking
        icon: pi-hole.png
        ping: 192.168.1.20
        # Widget STILL disabled — retested 2026-08-15 on Homepage 1.13.2.
        # The version reasoning in the old note was stale (we are well past
        # 1.4.x), but the cache bug itself is real and still present: Homepage's
        # pihole proxy handler throws "Cache timeout must be a positive number"
        # on every call, surfacing as {"error":"Unexpected error"}.
        # Pi-hole itself is fine — v6.4.3, /api/stats/summary returns live data
        # unauthenticated. This is a Homepage-side bug, so retest after a
        # Homepage upgrade (v2.0.0 is out) and not before.
        # widget:
        #   type: pihole
        #   url: http://192.168.1.20:20720
        #   key: "{{HOMEPAGE_VAR_PIHOLE_KEY}}"
        #   version: 6

    - Tailscale:
        href: https://login.tailscale.com
        description: VPN mesh network
        icon: tailscale.png

- Infrastructure:
    - TrueNAS:
        href: http://the-library.tail227692.ts.net
        description: NAS management
        icon: truenas.png
        ping: 192.168.1.20
        # Widget still disabled, but NOT for the reason previously recorded.
        # The old note blamed a Homepage 1.3.12 cache bug; the real blocker is
        # server-side. On TrueNAS 25.10 the REST API returns HTTP 500 on every
        # v2.0 endpoint with a valid key (401 without one, so auth is fine).
        # iX are migrating to the JSON-RPC websocket API. Re-test after a
        # TrueNAS upgrade, not after a Homepage upgrade.
        # widget:
        #   type: truenas
        #   url: https://192.168.1.20
        #   key: "{{HOMEPAGE_VAR_TRUENAS_KEY}}"
        #   enablePools: true

    - Grafana:
        href: http://the-library.tail227692.ts.net:30300
        description: Sensor dashboard — temps & fans
        icon: grafana.png
        ping: 192.168.1.20
        widget:
          type: grafana
          url: http://192.168.1.20:30300
          username: admin
          password: "{{HOMEPAGE_VAR_GRAFANA_PASS}}"
          # version 2 uses Grafana's unified-alerting endpoint. Without it the
          # widget first calls the legacy /api/alerts, removed in Grafana 9+,
          # and eats a guaranteed 404 on every refresh before falling back.
          version: 2

    - Dockge:
        href: http://the-library.tail227692.ts.net:31014
        description: Docker compose manager
        icon: dockge.png
        ping: 192.168.1.20

    - File Browser:
        href: http://the-library.tail227692.ts.net:30051
        description: Web file manager
        icon: filebrowser.png
        ping: 192.168.1.20
