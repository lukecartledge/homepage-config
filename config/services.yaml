---
# Homepage services.yaml
# Docs: https://gethomepage.dev/configs/services/
# Secrets use {{HOMEPAGE_VAR_*}} — real values in TrueNAS app env vars

- Media:
    - Jellyfin:
        href: http://the-library.tail227692.ts.net:8096
        description: Media server
        icon: jellyfin.png
        ping: 192.168.1.20
        widget:
          type: jellyfin
          url: http://192.168.1.20:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          enableBlocks: true
          enableNowPlaying: true

    - qBittorrent:
        href: http://the-library.tail227692.ts.net:30024
        description: Torrent client
        icon: qbittorrent.png
        ping: 192.168.1.20
        widget:
          type: qbittorrent
          url: http://192.168.1.20:30024
          username: "{{HOMEPAGE_VAR_QBT_USER}}"
          password: "{{HOMEPAGE_VAR_QBT_PASS}}"

- Documents:
    - Paperless-ngx:
        href: http://the-library.tail227692.ts.net:30070
        description: Document management
        icon: paperless-ngx.png
        ping: 192.168.1.20
        widget:
          type: paperlessngx
          url: http://192.168.1.20:30070
          key: "{{HOMEPAGE_VAR_PAPERLESS_KEY}}"

    - Paperless-AI:
        href: http://the-library.tail227692.ts.net:30226
        description: AI document processing
        icon: mdi-robot-outline
        ping: 192.168.1.20

    - Mealie:
        href: http://the-library.tail227692.ts.net:30111
        description: Recipe & meal planning
        icon: mealie.png
        ping: 192.168.1.20
        widget:
          type: mealie
          url: http://192.168.1.20:30111
          key: "{{HOMEPAGE_VAR_MEALIE_KEY}}"
          version: 2

- Automation:
    - Home Assistant:
        href: http://the-library.tail227692.ts.net:30103
        description: Home automation
        icon: home-assistant.png
        ping: 192.168.1.20
        widget:
          type: homeassistant
          url: http://192.168.1.20:30103
          key: "{{HOMEPAGE_VAR_HASS_TOKEN}}"

    - n8n:
        href: http://the-library.tail227692.ts.net:30109
        description: Workflow automation
        icon: n8n.png
        ping: 192.168.1.20

    - Ollama:
        href: http://the-library.tail227692.ts.net:30068
        description: Local LLM runner
        icon: ollama.png
        ping: 192.168.1.20
        # No widget — unsupported in Homepage 1.3.12

- Networking:
    - Pi-hole:
        href: http://the-library.tail227692.ts.net:20720/admin
        description: DNS ad blocking
        icon: pi-hole.png
        ping: 192.168.1.20
        # Widget blocked: Homepage 1.3.12 cache bug — uncomment after upgrade to 1.4.x+
        # widget:
        #   type: pihole
        #   url: http://192.168.1.20:20720
        #   key: "{{HOMEPAGE_VAR_PIHOLE_KEY}}"
        #   version: 6

    - Tailscale:
        href: https://login.tailscale.com
        description: VPN mesh network
        icon: tailscale.png

- Infrastructure:
    - Dockge:
        href: http://the-library.tail227692.ts.net:5001
        description: Docker compose manager
        icon: dockge.png
        ping: 192.168.1.20

    - File Browser:
        href: http://the-library.tail227692.ts.net:30051
        description: Web file manager
        icon: filebrowser.png
        ping: 192.168.1.20

    - TrueNAS:
        href: http://the-library.tail227692.ts.net
        description: NAS management
        icon: truenas.png
        # Widget blocked: Homepage 1.3.12 cache bug — uncomment after upgrade to 1.4.x+
        # widget:
        #   type: truenas
        #   url: http://192.168.1.20
        #   key: "{{HOMEPAGE_VAR_TRUENAS_KEY}}"
        #   enablePools: true
