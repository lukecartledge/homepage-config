---
# Homepage settings.yaml
# Docs: https://gethomepage.dev/configs/settings/

title: Home
description: Luke's homelab dashboard

theme: dark
color: slate
headerStyle: clean
iconStyle: theme
statusStyle: dot
fullWidth: false
useEqualHeights: true

language: en

header: true
footer: true

# Consolidated to four groups 2026-08-15. Library folded into Documents;
# Automation retired (Ollama uninstalled, Home Assistant and n8n tiles dropped).
# Group names here must match the group keys in services.yaml exactly.
layout:
  Media:
    style: row
    columns: 2
    icon: mdi-play-circle-outline

  Documents:
    style: row
    columns: 3
    icon: mdi-file-document-outline

  Network:
    style: row
    columns: 2
    icon: mdi-network-outline

  Infrastructure:
    style: row
    columns: 2
    icon: mdi-server-outline
    # 3 columns left File Browser orphaned alone on a second row. This group
    # holds four tiles, so 2 columns gives a balanced 2x2 with no gap.
    # Was initiallyCollapsed. Un-collapsed 2026-08-15: this group now holds
    # Grafana, which is worth seeing at a glance rather than hiding behind a
    # click alongside the pure-admin tiles.

  # Bookmark group. A single group with flex-1 stretches to the full page
  # width and stacks its four entries vertically, stranding each URL far to
  # the right. Four columns puts them on one row.
  Admin:
    style: row
    columns: 4
